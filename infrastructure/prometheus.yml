global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: demomart
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:8000
          - order:8000
          - inventory:8000
          - payment:8000
          - booking-api:8000


