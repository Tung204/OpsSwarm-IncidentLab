[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsswarm-incidentlab-enterprise"
version = "2.1.0+lab"
description = "OpsSwarm IncidentLab aligned with OpsSwarm Enterprise OpenClaw + GitHub architecture"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6.0,<7", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["opsswarm*"]
