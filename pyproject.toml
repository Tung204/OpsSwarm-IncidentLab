[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsswarm-incidentlab"
version = "1.2.0"
description = "Independent stateful incident simulator for OpsSwarm Enterprise"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyYAML>=6.0,<7", "ruff>=0.6,<1", "httpx2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["incidentlab*"]
